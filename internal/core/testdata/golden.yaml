# 路由金标集：每条是宿主可能派给 Switchboard 的一句话，want 是「该用哪一档」。
# 标注按任务本身的难度来定，不迁就现有规则；规则判不对就改规则，别改标注。
# want：low / mid / high（文本三档），image / video / animation（媒体）。
# 新增来源：imls golden 导出的「判低了」记录，人工复核后贴进来。

