# 盲测集：由另一个模型（Sonnet 5.5）独立写出并标注，2026-10-18；改规则时不看这份，只用它量准确率。
# 规则调好后在这里量出的数字才可信；golden.yaml 是调规则用的，会过拟合。
- {p: "把这句翻译成英文:「这个功能下个版本再上,先别急」", want: low}
- {p: "git 怎么撤销上一次 commit 但保留改动", want: low}
- {p: "写个 Python 脚本,批量把目录下的 png 转成 webp,质量 80", want: mid}
- {p: "两个事务互相等,但我明明按同样顺序加锁的,为啥还死锁?", want: high}
- {p: "给我画一张赛博朋克风格的上海外滩夜景,竖版,适合做手机壁纸", want: image}
- {p: "帮我把这段视频脚本文案润色一下,口语一点,别太书面", want: low}
- {p: "图片上传接口返回 413,nginx 要怎么改", want: mid}
- {p: "Translate to Chinese: \"Please make sure the migration is idempotent before merging.\"", want: low}
- {p: "做一个 5 秒的海浪视频,镜头缓慢推进", want: video}
- {p: "线上订单服务每隔几天会有一两笔重复扣款,日志里看不出规律,重试逻辑和 MQ 消费都查过了,还是想不通怎么来的", want: high}
- {p: "帮我给这个函数补单元测试:\n```python\ndef clamp(x, lo, hi):\n    return max(lo, min(x, hi))\n```", want: mid}
- {p: "我这边有一份会议纪要,大概两千字,里面讲了排期、人员、预算三块,你帮我只把里面提到的所有日期抽出来,按时间顺序列成清单就行,别的不用管", want: low}
- {p: "做个片头动效,白底,文字「iML Studio」逐字弹出,然后 logo 缩放进来,6 秒", want: animation}
- {p: "Redis 分布式锁在主从切换时怎么保证不会两个客户端同时持有?Redlock 够用吗", want: high}
- {p: "视频播放器拖进度条的时候有点卡,帮我看看这段 requestAnimationFrame 的写法是不是有问题", want: mid}
- {p: "这个报错啥意思?ENOENT: no such file or directory, open './config.json'", want: low}
- {p: "来个海报,主题是「周末骑行活动」,要有手绘感", want: image}
- {p: "Write a TypeScript function that debounces an async function and returns the latest result.", want: mid}
- {p: "把这个 JSON 转成 YAML:{\"name\":\"a\",\"port\":8080}", want: low}
- {p: "帮我设计一个多租户 SaaS 的权限系统,要支持角色继承、资源级授权,还得能审计谁改了什么", want: high}
- {p: "tar 解压到指定目录的命令是啥", want: low}
- {p: "React 里 useEffect 和 useLayoutEffect 到底啥区别,什么时候该用后者", want: mid}
- {p: "怎么让两个手机端离线编辑同一份文档,联网后合并还不丢数据?", want: high}
- {p: "帮我把这封邮件语气改得客气一点:「你们的接口又挂了,赶紧修」", want: low}
