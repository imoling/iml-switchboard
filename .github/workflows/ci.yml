# 每次推送和合并请求：三个平台跑全部 Go 测试（含路由金标集、盲测集、合规测试）和界面检查。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go 测试
        shell: bash
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee go-test.log
          go test ./... -timeout 600s 2>&1 | tee -a go-test.log
      # 日志要管理员权限才能下载；把失败明细写成注释，公开可读
      - name: 失败明细
        if: failure()
        shell: bash
        run: |
          # awk 拼行：macOS 的 BSD sed 不认 GNU 的写法
          detail=$(grep -E -- '--- FAIL|_test\.go:[0-9]+|\.go:[0-9]+:[0-9]+|panic:|^FAIL|exit status' go-test.log | head -80 | tr -d '\r' | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}')
          echo "::error title=go test 失败::${detail}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: 界面检查
        working-directory: ui
        run: |
          npm ci
          npm run check
